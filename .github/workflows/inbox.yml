name: Traiter inbox
on:
  push:
    branches: [main]
    paths: ["inbox/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: inbox
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r scripts/requirements.txt
      - run: python3 scripts/process_inbox.py
      - name: Commit
        run: |
          git config user.name "inbox-bot"
          git config user.email "inbox-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Ajoute des photos depuis inbox" && git push)
